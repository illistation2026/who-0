function rand(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function tagsFor(c){let t=[...(c.tags||[])];if(gallifreyans.has(c.name)&&!t.includes('Gallifreyan'))t.push('Gallifreyan');if(gallifreyans.has(c.name)&&!t.includes('Time Lord'))t.push('Time Lord');return t}

function role(c,slot){
 if(slot==='Doctor'){if(c.type!=='Doctor')return false;let n=doctorNumbers[c.name];return n>=settings.minDoc&&n<=settings.maxDoc}
 if(slot.startsWith('Companion'))return c.type==='Companion';

}

  else if(bal>0){title='THE UNIVERSE IS SAFER THAN IT WAS';pool=['There are dark corners of the universe where evil breeds. When it does, somebody has to stand against it. This time, that somebody was you.','“Change, my dear. And not a moment too soon.” Things are not perfect, but the timeline is moving in the right direction.','You cannot fix every corner of creation. But you can leave it better than you found it.'];}
  else if(bal===0){title='THE BALANCE HOLDS';pool=['History remains intact. Mostly. Nobody mention the cracks, paradoxes or that unfortunate business with Belgium.','No victory. No defeat. Just another impossible day survived.'];}

 }

function buildRunOpponents(list){
 const unique=[...new Map(list.map(o=>[o.name,o])).values()];
 const high=shuffle(unique.filter(o=>o.threat>80));
 const low=shuffle(unique.filter(o=>o.threat<=80));
 const highCount=Math.min(3,high.length,Math.floor(Math.random()*4));
 let chosen=high.slice(0,highCount).concat(low.slice(0,20-highCount));
 if(chosen.length<20)chosen=chosen.concat(high.slice(highCount,highCount+(20-chosen.length)));
 return shuffle(chosen.slice(0,20)).map(o=>({...o,form:Math.floor(Math.random()*11)-5}));
}

 let before=run&&run.results?run.results.length:0,o=run&&currentOpponent();resolveEncounterV12Core(autoAdvance);if(run&&run.results.length>before&&o){let hero=v12HeroFor(o);let row=run.results[run.results.length-1];row.hero=hero;let card=document.querySelector('.encounterHero');if(card&&hero)card.querySelector('.story')?.insertAdjacentHTML('afterend',`<div class="heroFlash">★ HERO · ${hero}</div>`)}
}
function v12HeroAwards(){
 if(!run||!run.heroPoints)return '';let sorted=Object.entries(run.heroPoints).sort((a,b)=>b[1]-a[1]);if(!sorted.length)return '';let top=sorted[0];if(top[1]>=5)unlock('timelineHero');let statName=k=>{let x=Object.entries(run.heroStats?.[k]||{}).sort((a,b)=>b[1]-a[1])[0];return x?x[0]:'—'};
 return `<div class="card"><div class="small">YOUR TEAM’S HEROES</div><h2>HERO OF THE TIMELINE</h2><div class="heroWinner">★ ${top[0]}<span>${top[1]} heroic encounter${top[1]===1?'':'s'}</span></div><div class="miniTable"><div class="miniRow"><span>BRAINS OF THE OPERATION</span><b>${statName('sci')}</b></div><div class="miniRow"><span>ACTION HERO</span><b>${statName('act')}</b></div><div class="miniRow"><span>VOICE OF REASON</span><b>${statName('inf')}</b></div><div class="miniRow"><span>LAST ONE STANDING</span><b>${statName('surv')}</b></div></div></div>`
}

// Results route into one of two bonus games.
function showNormalResults(){
 let archive=loadArchive();app.innerHTML=teamHTML()+`<div class="card"><div class="small">FINAL RECORD</div><div class="verdictScore"><div><b>${run.wins}</b><span>WON</span></div><div><b>${run.draws}</b><span>DRAWN</span></div><div><b>${run.losses}</b><span>LOST</span></div></div><div class="small">TEAM VALUE ${slots.filter(s=>team[s]).reduce((n,s)=>n+overall(team[s],s),0)}</div></div>${v12HeroAwards()}
 <div class="card"><div class="small">ENCOUNTER RECORD</div>${run.results.map((x,i)=>`<div class="miniRow"><span>${i+1}. ${x.name}${x.hero?`<br><span class="small">★ ${x.hero}</span>`:''}</span><b class="${x.res==='WIN'?'win':x.res==='LOSS'?'loss':'draw'}">${x.res}</b></div>`).join('')}</div>
 <div class="card"><div class="small">THE BLACK ARCHIVE</div><div class="story">${archive.awards.length} records currently unlocked on this device.</div><button class="secondary" style="margin-top:10px" onclick="showArchive()">OPEN BLACK ARCHIVE</button></div>
 ${run.wins>=15?deathZonePrompt():run.wins>=10?celestialPrompt():`<div class="card"><button onclick="startGame()">PLAY AGAIN</button><button class="secondary" style="margin-top:8px" onclick="menu()">MENU</button></div>`}`;scrollTop()
}
function deathZonePrompt(){return `<div class="card retro deathZone"><div class="pixelTower"><div class="towerTop"></div><div class="towerBody"></div></div><div class="small">BONUS GAME UNLOCKED</div><h2>ENTER THE DEATH ZONE</h2><p>Five threats stand between your TARDIS team and the Tomb of Rassilon. Another Doctor is breaking through.</p><button onclick="chooseBonusDoctor()">ENTER THE DEATH ZONE</button></div>`}
function multiDoctorPrompt(){return deathZonePrompt()}
function celestialPrompt(){return `<div class="card retro playroom"><div class="small">BONUS GAME UNLOCKED</div><div class="toyCard"><div class="toyFace">♛</div><b>THE TOYMAKER</b></div><h2>THE CELESTIAL PLAYROOM</h2><p>The Toymaker has a new game for you.</p><button onclick="startCelestialIntro()">ACCEPT THE CHALLENGE</button></div>`}

function startBonus(i){let ally=eventState.candidates[i];bonusRun={ally,index:0,wins:0,draws:0,losses:0,results:[],opponents:shuffle([...new Map(bonusOpponents.map(o=>[o.name,o])).values()]).slice(0,5).map(o=>({...o,form:Math.floor(Math.random()*21)-15}))};showBonusEncounter()}
function showBonusEncounter(){
 if(bonusRun.index>=bonusRun.opponents.length){finishBonus();return}let o=bonusRun.opponents[bonusRun.index],progress='▰'.repeat(bonusRun.index)+'▱'.repeat(5-bonusRun.index);
 app.innerHTML=`<div class="card retro deathZone"><div class="pixelTower smallTower"><div class="towerTop"></div><div class="towerBody"></div></div><div class="small">ENTER THE DEATH ZONE · ${bonusRun.index+1} / 5</div><div class="deathProgress">${progress}</div><h2>${o.name}</h2><div class="doctorCrew">${team.Doctor.name} + ${bonusRun.ally.name}</div><div class="form">FORM ${formText(o.form)}</div>${settings.autoRun?'':`<button style="margin-top:14px" onclick="battleBonus(false)">FACE THE THREAT</button>`}</div>`;scrollTop();if(settings.autoRun)setTimeout(()=>battleBonus(true),350)
}
function battleBonus(autoAdvance){let o=bonusRun.opponents[bonusRun.index];app.innerHTML=`<div class="card retro deathZone battleStage"><div class="small">DEATH ZONE ${bonusRun.index+1} / 5</div><div class="pixelTower pulseTower"><div class="towerTop"></div><div class="towerBody"></div></div><div class="battleEnemy">${o.name}</div><div class="battlePulse"></div><div class="small">CALCULATING SURVIVAL PROBABILITY…</div></div>`;scrollTop();setTimeout(()=>resolveBonusV11(autoAdvance),1000)}
function finishBonus(){
 if(bonusRun.wins===5)unlock('bonus');let show=()=>{let c=endingCopy(bonusRun.wins,bonusRun.draws,bonusRun.losses,true),ach=newUnlockHTML();app.innerHTML=`<div class="card retro deathZone"><div class="small">THE TOMB OF RASSILON</div><h1>${bonusRun.wins===5?'TIME LORD VICTORIOUS':c.title}</h1><div class="verdictScore"><div><b>${bonusRun.wins}</b><span>WON</span></div><div><b>${bonusRun.draws}</b><span>DRAWN</span></div><div><b>${bonusRun.losses}</b><span>LOST</span></div></div>${ach}<button style="margin-top:18px" onclick="showBonusResults()">VIEW DEATH ZONE RECORD</button></div>`;scrollTop()};if(bonusRun.wins>=4)runCelebration(bonusRun.wins===5?'TIME LORD VICTORIOUS':'THE TOMB IS WITHIN REACH',`${bonusRun.wins}/5`,show,bonusRun.wins===5);else show()
}
function resolveBonusV11(autoAdvance=false){let o=bonusRun.opponents[bonusRun.index],p=(bonusMetric(o.k1)+bonusMetric(o.k2))/2+chemistry()+(Math.random()*10-5),r=p-(o.threat+o.form),res=r>3?'WIN':r<-3?'LOSS':'DRAW';if(res==='WIN')bonusRun.wins++;else if(res==='DRAW')bonusRun.draws++;else bonusRun.losses++;let txt=story(o,res);bonusRun.results.push({...o,res,story:txt});remember('enemies',o.name);app.innerHTML=`<div class="card retro deathZone"><div class="small">DEATH ZONE · ${o.name}</div><div class="resultWord ${res==='WIN'?'win':res==='LOSS'?'loss':'draw'}">${res}</div><div class="story">${txt}</div>${autoAdvance?'':`<button style="margin-top:14px" onclick="bonusRun.index++;showBonusEncounter()">CONTINUE TOWARDS THE TOWER</button>`}</div>`;scrollTop();if(autoAdvance)setTimeout(()=>{bonusRun.index++;showBonusEncounter()},1150)}

// Celestial Playroom — a five-card hidden-stat Top Trumps game.
const toyTaunts={win:['“Zerry gut, Herr Doctor… but not gut enough.”','“Oh dear. I thought you were supposed to be clever.”','“The game proceeds. Do try to keep up.”'],lose:['“A point to you. How tiresome.”','“Bravo! Bravo! Enjoy it while it lasts.”','“Oh! You deliberately did that. I like you.”'],tie:['“A draw? How untidy. Still, the game must go on.”'],final:['“Ahhh. And now there is no choice at all.”','“No more choices. No more tricks. Just you… and me.”']};
function toymakerPool(){return uniqueCharacters(allCharacters()).filter(c=>c&&c.name&&!Object.values(team).some(x=>x.name===c.name))}
function startCelestialIntro(){
 let pool=shuffle(toymakerPool()),doc=pool.find(c=>c.type==='Doctor')||pool[0],comps=pool.filter(c=>c.type==='Companion'&&c!==doc).slice(0,2),ups=pool.filter(c=>c.type==='Support'&&c!==doc).slice(0,2),toy=[doc,...comps,...ups];while(toy.length<5){let c=pool.find(x=>!toy.includes(x));if(!c)break;toy.push(c)}
 let attrs=shuffle(['sci','act','inf','surv']);let modes=shuffle(['HIGH','HIGH','LOW','LOW']);celestial={round:0,wins:0,losses:0,draws:0,player:slots.map(s=>({slot:s,c:team[s],used:false})),toy:toy.slice(0,5).map(c=>({c,used:false})),rounds:attrs.map((a,i)=>({attr:a,mode:modes[i]})).concat([{attr:'overall',mode:Math.random()<.5?'HIGH':'LOW'}])};
 app.innerHTML=`<div class="card retro playroom"><div class="toyCard"><div class="toyFace">♛</div><b>THE TOYMAKER</b></div><h2>THE CELESTIAL PLAYROOM</h2><div class="speaker">“Five players. Five games. Every card may be played only once. Sometimes the greatest wins. Sometimes the least. The rules are mine, Doctor… <b>choose carefully.</b>”</div><button style="margin-top:16px" onclick="showCelestialRound()">PLAY</button></div>`;scrollTop()
}
function celestialVal(c,a,slot=''){return a==='overall'?overall(c,slot):(c[a]||0)}
function showCelestialRound(){
 if(celestial.round>=5)return finishCelestial();let r=celestial.round,rule=celestial.rounds[r],last=r===4,avail=celestial.player.filter(x=>!x.used);
 app.innerHTML=`<div class="card retro playroom"><div class="small">${last?'THE FINAL GAME':`ROUND ${r+1} / 5`}</div><h1>${rule.attr.toUpperCase()}</h1><div class="trumpMode">${rule.mode==='HIGH'?'▲ HIGHEST WINS':'▼ LOWEST WINS'}</div>${last?`<div class="speaker">${rand(toyTaunts.final)}</div>`:'<div class="small">CHOOSE ONE CARD</div>'}<div class="playColumns"><div><b>YOUR TEAM</b>${celestial.player.map((x,i)=>`<button class="cardName ${x.used?'used':''}" ${x.used||last?'disabled':''} onclick="celestialPick(${i})">${x.c.name}</button>`).join('')}</div><div><b>THE TOYMAKER</b>${celestial.toy.map(x=>`<div class="cardName ${x.used?'used':''}">${x.c.name}</div>`).join('')}</div></div>${last?'<button style="margin-top:16px" onclick="celestialFinal()">REVEAL THE FINAL CARDS</button>':''}<div class="small" style="margin-top:12px">YOU ${celestial.wins} · ${celestial.losses} TOYMAKER</div></div>`;scrollTop()
}
function celestialPick(i){let p=celestial.player[i];if(!p||p.used)return;celestialResolve(p)}
function celestialFinal(){let p=celestial.player.find(x=>!x.used);celestialResolve(p)}
function celestialResolve(p){
 let rule=celestial.rounds[celestial.round],available=celestial.toy.filter(x=>!x.used),scored=available.map(x=>({x,v:celestialVal(x.c,rule.attr)}));scored.sort((a,b)=>rule.mode==='HIGH'?b.v-a.v:a.v-b.v);let pick=Math.random()<.72?scored[0]:rand(scored),t=pick.x;p.used=true;t.used=true;let pv=celestialVal(p.c,rule.attr,p.slot),tv=celestialVal(t.c,rule.attr),out=pv===tv?'DRAW':(rule.mode==='HIGH'?(pv>tv):(pv<tv))?'WIN':'LOSS';if(out==='WIN')celestial.wins++;else if(out==='LOSS')celestial.losses++;else celestial.draws++;
 let taunt=out==='WIN'?rand(toyTaunts.lose):out==='LOSS'?rand(toyTaunts.win):rand(toyTaunts.tie);app.innerHTML=`<div class="card retro playroom"><div class="small">${rule.attr.toUpperCase()} · ${rule.mode} WINS</div><div class="trumpReveal"><div><b>${p.c.name}</b><strong>${pv}</strong></div><div class="versus">VS</div><div><b>${t.c.name}</b><strong>${tv}</strong></div></div><div class="resultWord ${out==='WIN'?'win':out==='LOSS'?'loss':'draw'}">${out}</div><div class="speaker">${taunt}</div><button style="margin-top:14px" onclick="celestial.round++;showCelestialRound()">${celestial.round===4?'SEE THE RESULT':'NEXT GAME'}</button></div>`;scrollTop()
}
function finishCelestial(){
 if(celestial.wins===5)unlock('playroomSweep');let title=celestial.wins===5?'YOU BEAT THE TOYMAKER AT HIS OWN GAME':celestial.wins===4?'A MOST IMPRESSIVE VICTORY':celestial.wins===3?'THE GAME IS YOURS':celestial.wins===2?'SO CLOSE…':celestial.wins===1?'THE TOYMAKER LAUGHS':'PLAYTHING OF THE TOYMAKER';let ach=newUnlockHTML();app.innerHTML=`<div class="card retro playroom"><div class="toyCard"><div class="toyFace">♛</div><b>THE TOYMAKER</b></div><div class="small">THE CELESTIAL PLAYROOM</div><h1>${title}</h1><div class="verdictScore"><div><b>${celestial.wins}</b><span>YOU</span></div><div><b>${celestial.draws}</b><span>DRAWN</span></div><div><b>${celestial.losses}</b><span>TOYMAKER</span></div></div>${ach}<div class="speaker">${celestial.wins>=3?'“Very well, Doctor. You may leave my playroom… this time.”':'“Another game? Oh, I think you owe me one.”'}</div><button style="margin-top:16px" onclick="menu()">RETURN TO WHO-0</button></div>`;scrollTop()
}

menu();
</script></body></html>
