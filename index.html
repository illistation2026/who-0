const app=document.getElementById('app');
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function doctorNoForSeason(s){let d=s.chars.find(c=>c.type==='Doctor');return d?doctorNumbers[d.name]:null}
function availableSeasons(){return seasons.filter(s=>{let n=doctorNoForSeason(s);return n&&n>=settings.minDoc&&n<=settings.maxDoc})}
function role(c,slot){if(slot==='Doctor')return c.type==='Doctor';if(slot.startsWith('Companion'))return c.type==='Companion';return c.type==='Support'}
function overall(c,slot=''){let base=(c.sci+c.act+c.inf+c.surv)/4;if(c.type==='Doctor')base=base*.82+(c.pop||80)*.18;if(slot==='Companion 1')base=base*.72+c.sci*.28;if(slot==='Companion 2')base=base*.72+c.act*.28;return Math.round(base)}
function menu(){
 app.innerHTML=`<div class="card hero"><div class="small">THE UNIVERSE NEEDS A TEAM</div><h2>Choose wisely.<br>Then survive.</h2><p>Draw a Doctor Who television season and recruit one character at a time. Build a Doctor, two Companions and two Team-ups, then face 20 classic adversaries.</p><p>Your choices have different strengths. Chemistry matters. Exceptional runs may disturb the fabric of time.</p><button onclick="startGame()">START GAME</button></div>
 <div class="card"><b>Re-rolls</b><div class="small">Change how forgiving the draft is.</div><div class="segment">${[0,1,3].map(n=>`<button class="${settings.rerolls===n?'on':''}" onclick="setRerolls(${n})">${n}<br><span class="small">${n===0?'Hard':n===1?'Normal':'Easy'}</span></button>`).join('')}</div></div>
 <div class="card"><b>Doctor era</b><div class="small">Only seasons featuring Doctors inside this range enter the draw.</div><div class="rangeRow"><select id="minD" onchange="rangeChanged()">${doctorOpts(settings.minDoc)}</select><span>to</span><select id="maxD" onchange="rangeChanged()">${doctorOpts(settings.maxDoc)}</select></div><div class="rangePreview">${Array.from({length:15},(_,i)=>`<div class="docDot ${i+1>=settings.minDoc&&i+1<=settings.maxDoc?'on':''}">${i+1}</div>`).join('')}</div></div>`;

 window.scrollTo({top:0,behavior:'smooth'})
}

function slotPower(slot,key){let c=team[slot],base=c[key]||0;if(slot==='Companion 1')base=base*.75+c.sci*.25;if(slot==='Companion 2')base=base*.75+c.act*.25;return base}
function teamMetric(key){let d=team.Doctor,dv=key==='Doctor'?doctorPower():(d[key]||doctorPower());return(dv+slotPower('Companion 1',key)+slotPower('Companion 2',key)+slotPower('Team-up 1',key)+slotPower('Team-up 2',key))/5}

function achievements(){let v=Object.values(team),a=[],all=t=>v.every(c=>c.tags.includes(t));if(all('TARDIS'))a.push('All Aboard · every member has TARDIS experience');if(all('Off Earth'))a.push('Not From Around Here · everyone has been off Earth');if(all('Daleks'))a.push('Exterminate This · everyone has encountered the Daleks');if(all('Davros'))a.push('I Know Davros · everyone has encountered Davros');if(v.filter(c=>c.tags.includes('UNIT')).length>=3)a.push('UNIT Family · three or more UNIT-linked characters');return a}
function simulate(){
 let wins=0,draws=0,ch=chemistry();results=[];
 opponents.forEach(([name,k1,k2],idx)=>{let p=(teamMetric(k1)+teamMetric(k2))/2+ch+(Math.random()*18-9),enemy=72+idx*.9+Math.random()*12,r=p-enemy,res=r>3?'WIN':r<-3?'LOSS':'DRAW';if(res==='WIN')wins++;if(res==='DRAW')draws++;results.push({name,res,story:story(name,res)})});
 let a=achievements(),total=wins*3+draws;
 app.innerHTML=`<div class="card"><div class="small">FINAL RECORD</div><div class="score">${wins}-${draws}-${20-wins-draws}</div><div class="small">SCORE ${total} · TEAM VALUE ${slots.reduce((n,s)=>n+overall(team[s],s),0)}</div></div><div class="card">${results.map((x,i)=>`<div class="encounter"><div class="small">ENCOUNTER ${i+1}/20</div><b>${x.name}</b><div class="${x.res==='WIN'?'win':x.res==='LOSS'?'loss':'draw'}">${x.res}</div><div class="story">${x.story}</div></div>`).join('')}</div><div class="card"><div class="small">SECRET ARCHIVE</div>${a.length?a.map(x=>`<div class="ach">🔓 ${x}</div>`).join(''):`<div class="empty">No hidden combinations found this run.</div>`}</div>${wins>=15?multiDoctorPrompt():`<div class="card"><button onclick="startGame()">PLAY AGAIN</button><button class="secondary" style="margin-top:8px" onclick="menu()">MENU</button></div>`}`;
 window.scrollTo({top:0,behavior:'smooth'})
}
function multiDoctorPrompt(){return `<div class="card vortex"><div class="small">TIME DISTORTION DETECTED</div><h2>Something is wrong with time.</h2><p>Your performance has attracted help from elsewhere in the Doctor's timeline.</p><button onclick="multiDoctor()">ENTER THE VORTEX</button></div>`}
function multiDoctor(){
 let currentNo=doctorNumbers[team.Doctor.name],docs=availableSeasons().map(s=>s.chars.find(c=>c.type==='Doctor')).filter(Boolean).filter((d,i,a)=>doctorNumbers[d.name]!==currentNo&&a.findIndex(x=>x.name===d.name)===i);
 let allies=[];while(docs.length&&allies.length<2){let i=Math.floor(Math.random()*docs.length);allies.push(docs.splice(i,1)[0])}
 let crew=[team.Doctor,...allies],power=crew.reduce((n,d)=>n+overall(d),0)/crew.length;
 let foes=['The Master','The Time Lords','The Daleks'],wins=0,rows=foes.map((f,i)=>{let ok=power+(Math.random()*20-10)>78+i*5;if(ok)wins++;return `<div class="encounter"><b>${f}</b><div class="${ok?'win':'loss'}">${ok?'VICTORY':'DEFEAT'}</div><div class="story">${ok?rand(winLines):rand(lossLines)}</div></div>`}).join('');
 app.innerHTML=`<div class="card vortex"><div class="small">MULTI-DOCTOR ADVENTURE</div><h2>${wins===3?'TIMELINE RESTORED':'TIME IS FRACTURING'}</h2><div class="doctorCrew">${crew.map(d=>d.name).join(' · ')}</div></div><div class="card">${rows}</div><div class="card">${wins===3?'<div class="ach">🔓 THE THREE DOCTORS · Survive a Multi-Doctor Adventure</div>':''}<button onclick="startGame()">PLAY AGAIN</button><button class="secondary" style="margin-top:8px" onclick="menu()">MENU</button></div>`;
 window.scrollTo({top:0,behavior:'smooth'})
}
menu();
</script></body></html>
