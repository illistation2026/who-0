function rand(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function tagsFor(c){let t=[...(c.tags||[])];if(gallifreyans.has(c.name)&&!t.includes('Gallifreyan'))t.push('Gallifreyan');if(gallifreyans.has(c.name)&&!t.includes('Time Lord'))t.push('Time Lord');return t}
function charWithTags(c){return {...c,tags:tagsFor(c)}}
function allCharacters(){return seasons.flatMap(s=>s.chars.map(c=>({...charWithTags(c),season:s.n})))}
function uniqueCharacters(chars){let seen=new Set;return chars.filter(c=>{if(seen.has(c.name))return false;seen.add(c.name);return true})}
function doctorNosForSeason(s){return s.chars.filter(c=>c.type==='Doctor').map(c=>doctorNumbers[c.name]).filter(n=>n!=null)}
function availableSeasons(){return seasons.filter(s=>doctorNosForSeason(s).some(n=>n>=settings.minDoc&&n<=settings.maxDoc))}
function role(c,slot){
 if(slot==='Doctor'){if(c.type!=='Doctor')return false;let n=doctorNumbers[c.name];return n>=settings.minDoc&&n<=settings.maxDoc}
 if(slot.startsWith('Companion'))return c.type==='Companion';
 return c.type==='Support'
}
function overall(c,slot=''){let base=(c.sci+c.act+c.inf+c.surv)/4;if(c.type==='Doctor')base=base*.82+(c.pop||80)*.18;if(slot==='Companion 1')base=base*.72+c.sci*.28;if(slot==='Companion 2')base=base*.72+c.act*.28;return Math.round(base)}

function startGame(){

function chooseSeason(){
 let pool=availableSeasons();
 if(current&&pool.length>1)pool=pool.filter(s=>s!==current);
 current=rand(pool)
}
function offerForCurrent(){
 let empty=slots.filter(s=>!team[s]);
 let taken=new Set(Object.values(team).map(c=>c.name));
 let eligible=current.chars.map(charWithTags).filter(c=>!taken.has(c.name)&&empty.some(s=>role(c,s)));
 let target=Math.min(4,eligible.length);
 let mixed=shuffle(eligible).slice(0,target);
 // Make sure a Doctor is visible when the Doctor slot is empty and the season contains one.
 if(!team.Doctor){
   let docs=eligible.filter(c=>role(c,'Doctor'));
   if(docs.length&&!mixed.some(c=>c.type==='Doctor')){if(mixed.length)mixed[mixed.length-1]=rand(docs);else mixed=[rand(docs)]}
 }
 currentOffer=uniqueCharacters(mixed)
}
function drawSeason(){chooseSeason();offerForCurrent();draft()}

 rerollsLeft--;rerollsUsed++;offerForCurrent();draft()
}

 <div class="toolbar" style="margin-top:12px"><button class="ghost" onclick="resetUniverse()">RESET THE UNIVERSE</button><button class="secondary" ${rerollsLeft<1?'disabled':''} onclick="reroll()">RE-ROLL (${rerollsLeft})</button></div></div>`;scrollTop()

function pick(i,slot){
 let c=currentOffer[i];if(!c)return;
 if(Object.values(team).some(x=>x.name===c.name))return;
 team[slot]={...c,season:current.n};current=null;currentOffer=[];
 if(Object.keys(team).length<5)drawSeason();else draft()
}

function doctorPower(mod=0){let d=team.Doctor;return d.sci*.3+d.act*.15+d.inf*.25+d.surv*.15+d.pop*.15+mod}
function slotPower(slot,key){
 let c=team[slot];if(!c)return 0;
 let base=c[key]||0;if(slot==='Companion 1')base=base*.75+c.sci*.25;if(slot==='Companion 2')base=base*.75+c.act*.25;return base
}
function chemistry(){
 let b=0,v=Object.values(team);['TARDIS','Off Earth','UNIT','Daleks','Davros','Time Lord','Gallifreyan'].forEach(t=>{let n=v.filter(c=>c.tags.includes(t)).length;if(n>=3)b+=n*1.15});return b
}
function teamMetric(key,mods={}){
 let values=[];
 if(!mods.excludeDoctor&&team.Doctor){
   let d=team.Doctor,dv=key==='Doctor'?doctorPower(mods.doctorBonus||0):((d[key]||doctorPower())+(mods.doctorBonus||0));values.push(dv)
 }
 ['Companion 1','Companion 2','Team-up 1','Team-up 2'].forEach(s=>{if(team[s])values.push(slotPower(s,key))});
 if(mods.excludeKey===key)return 0;
 return values.length?values.reduce((a,b)=>a+b,0)/values.length:0
}
function encounterPower(o){
 let mods=run.mods||{};
 let p=(teamMetric(o.k1,mods)+teamMetric(o.k2,mods))/2+chemistry()+(Math.random()*10-5);
 return p
}
function formText(n){return n>0?`+${n}`:`${n}`}
function buildRunOpponents(list){return shuffle(list).map(o=>({...o,form:Math.floor(Math.random()*11)-5}))}
function beginRun(){
 let count=Math.random()<.35?2:1;
 let candidates=shuffle(Array.from({length:15},(_,i)=>i+2).filter(n=>n!==10));
 let eventAt=candidates.slice(0,count).sort((a,b)=>a-b);
 run={opponents:buildRunOpponents(normalOpponents),index:0,wins:0,draws:0,losses:0,results:[],mods:{},eventAt,eventTriggered:[],severePenalty:false,pendingReturn:null,spoilerPrepared:false};
 showEncounter()
}
function currentOpponent(){return run.opponents[run.index]}
function recordBox(){
 return `<div class="recordBar"><div><b>${run.wins}</b><span class="small">WINS</span></div><div><b>${run.draws}</b><span class="small">DRAWS</span></div><div><b>${run.losses}</b><span class="small">LOSSES</span></div></div>`
}
function showEncounter(){
 if(run.index>=20){finishRun();return}
 if(run.pendingReturn&&run.index===run.pendingReturn.at){restoreWaitingCompanion();return}
 if(run.index===10&&!halfwayDone){halfwayEvent();return}
 let number=run.index+1;
 if(run.eventAt.includes(number)&&!run.eventTriggered.includes(number)){triggerRareEvent(number);return}
 let o=currentOpponent();
 let spoiler=run.spoilerPrepared?`<div class="ach" style="margin-top:12px">📜 <b>SPOILERS:</b> You prepared for this encounter.</div>`:'';
 app.innerHTML=teamHTML()+`<div class="card encounterHero"><div class="encounterNo">ENCOUNTER ${number} / 20</div><div class="enemy">${o.name}</div><div class="form">FORM ${formText(o.form)}</div>${spoiler}<div class="story">${openingLine(o.name)}</div><button style="margin-top:16px" onclick="resolveEncounter()">RUN ENCOUNTER</button><button class="ghost" style="margin-top:8px" onclick="skipRemaining()">SKIP TO RESULTS</button>${recordBox()}</div>`;scrollTop()
}
function openingLine(name){
 const map={'Daleks':'A Dalek assault fleet is closing in.','Cybermen':'Conversion has begun. Logic says resistance is useless.','The Rani':'A Time Lord experiment is tearing the local timeline apart.','Morbius':'A forbidden Time Lord mind is stirring again.','Great Intelligence & Yeti':'The Intelligence has mobilised its Yeti.','The Candyman':'The pipes are filling with something far too sweet.','Weng-Chiang & Mr Sin':'Something sinister is moving through the fog.','The Axons':'Axonite is being offered to the whole world.'};
 return map[name]||`${name} stand between your team and the safety of the universe.`
}
const winLines=['The plan looks impossible right up until the moment it works.','At the last possible second, the Doctor spots the flaw. Everything changes.','One absurd idea, two seconds to spare, and the universe survives another day.','The trap snaps shut. Unfortunately for them, your team is already three moves ahead.'];
const lossLines=['The warning comes too late. The TARDIS is forced into retreat.','The Doctor had a plan. The enemy had anticipated it.','Something goes badly wrong. Then it gets worse.','The TARDIS engines scream. Staying another second would be fatal.'];
const drawLines=['Neither side wins. Your team escapes with seconds to spare.','The universe survives, but nobody is calling this a victory.','A final stalemate buys just enough time for the TARDIS to dematerialise.'];
const special={
'Daleks':{w:'The Dalek battle computer predicts victory with 99.7% certainty. The Doctor grins. That leaves 0.3%.',l:'“EXTERMINATE!” fills the air. The TARDIS dematerialises under heavy fire.'},
'Cybermen':{w:'Logic says resistance is useless. Your team introduces the Cybermen to a new variable.',l:'The conversion chambers activate. The Doctor has no choice but to run.'},
'Weeping Angels':{w:'Nobody blinks. Nobody breathes. Somehow, everyone makes it back to the TARDIS.',l:'Someone blinks. Then someone screams. When the lights return, the corridor is empty.'},
'Morbius':{w:'Morbius roars back to life. The Doctor answers with a contest of wills and wins by inches.',l:'The mind of Morbius overwhelms the room. Even the Doctor cannot hold the line.'},
'Silurians & Sea Devils':{w:'Two ancient Earth powers unite. Your team somehow prevents a war with humanity.',l:'The alliance beneath the Earth and sea proves too strong. Retreat is the only option.'},
'The Candyman':{w:'The Doctor turns the Happiness Patrol’s own absurd machinery against them.',l:'The fondant tide rises. This has become much less funny than it looked.'},
'Weng-Chiang & Mr Sin':{w:'The cabinet closes, Mr Sin is stopped, and history snaps back into place.',l:'In the fog and confusion, Weng-Chiang slips one move ahead.'},
'The Axons':{w:'The gift of Axonite proves to have one tiny flaw: the Doctor has read the small print.',l:'The Axons tighten their grip and the power drains away.'}
};
function timeRamStory(o){
 return rand([
 'Neither Time Lord will yield. Both TARDISes lock onto the same coordinates. A Time Ram becomes inevitable — until both sides disengage at the final second.',
 'The contest collapses into a deadlock. The Doctor threatens a Time Ram. For once, everyone decides survival is the better argument.',
 'Two Time Lord minds, two impossible plans, no way out. The TARDISes converge — then shear apart a heartbeat before a Time Ram.'
 ])
}
function story(o,res){
 if(res==='DRAW'&&o.timeLord)return timeRamStory(o);
 let s=special[o.name];if(s&&res==='WIN'&&s.w)return s.w;if(s&&res==='LOSS'&&s.l)return s.l;
 return rand(res==='WIN'?winLines:res==='LOSS'?lossLines:drawLines)
}
function resolveEncounter(auto=false){
 let o=currentOpponent(),p=encounterPower(o),enemy=o.threat+o.form,r=p-enemy,res=r>3?'WIN':r<-3?'LOSS':'DRAW';
 if(res==='WIN')run.wins++;else if(res==='DRAW')run.draws++;else run.losses++;
 let row={...o,res,story:story(o,res)};run.results.push(row);
 // one-encounter modifiers expire here
 run.mods={};run.spoilerPrepared=false;
 if(auto){run.index++;return}
 app.innerHTML=teamHTML()+`<div class="card encounterHero"><div class="encounterNo">ENCOUNTER ${run.index+1} / 20 · ${o.name}</div><div class="resultWord ${res==='WIN'?'win':res==='LOSS'?'loss':'draw'}">${res}</div><div class="story">${row.story}</div>${recordBox()}<button style="margin-top:16px" onclick="nextEncounter()">NEXT ENCOUNTER</button><button class="ghost" style="margin-top:8px" onclick="skipRemaining()">SKIP TO RESULTS</button></div>`;scrollTop()
}
function nextEncounter(){run.index++;showEncounter()}
function skipRemaining(){
 while(run.index<20){
   if(run.pendingReturn&&run.index===run.pendingReturn.at)applyWaitingReturnSilently();
   if(run.index===10&&!halfwayDone)halfwayDone=true; // skip interrupts if player skips
   resolveEncounter(true)
 }
 finishRun()
}

function rareChoice(choice){
 if(choice==='decline')return rareResult('PROBABLY WISE','Nothing changes. For once, causality is grateful.');
 if(choice==='sonic_try'){
   if(Math.random()<.5){run.mods.doctorBonus=5;return rareResult('MECHANICAL LOCK','The lock clicks open. <b>Doctor +5 for the next encounter.</b>')}
   run.mods.doctorBonus=-5;return rareResult('WOOD. OF COURSE IT’S WOOD.','The sonic achieves absolutely nothing useful. <b>Doctor -5 for the next encounter.</b>')
 }
 if(choice==='bat_hand'){run.mods.doctorBonus=(run.mods.doctorBonus||0)+2;return rareResult('BATTER UP','No cosmic shortcuts. Just timing. <b>Doctor +2 for the next encounter.</b>')}
 if(choice==='bat_omega'){
   if(Math.random()<.55){run.mods.doctorBonus=(run.mods.doctorBonus||0)+7;return rareResult('HAND OF OMEGA-POWERED','That was wildly irresponsible. It also worked. <b>Doctor +7 for the next encounter.</b>')}
   run.mods.doctorBonus=(run.mods.doctorBonus||0)-5;run.severePenalty=true;return rareResult('TOO MUCH POWER','The feedback nearly takes your head off. <b>Doctor -5 for the next encounter.</b>')
 }
 if(choice==='summit_chair'){
   if(Math.random()<.55){run.mods.doctorBonus=5;return rareResult('WAR AVERTED','Against all odds, the summit holds. <b>Doctor +5 for the next encounter.</b>')}
   run.mods.excludeDoctor=true;run.severePenalty=true;return rareResult('IMPOSTER!','Someone finally checks the credentials. The Doctor is ejected. <b>The Doctor’s score is excluded from the next encounter.</b>')
 }
 if(choice==='paper_show'){
   if(Math.random()<.62){run.mods.doctorBonus=4;return rareResult('OFFICIAL ENOUGH','Nobody questions it. <b>Doctor +4 for the next encounter.</b>')}
   run.mods.excludeDoctor=true;run.severePenalty=true;return rareResult('DOESN’T WORK ON THEM','They stare at the blank card. <b>The Doctor is excluded from the next encounter.</b>')
 }
 if(choice==='vortex_jump'){
   if(Math.random()<.58){run.mods.doctorBonus=5;return rareResult('RIGHT PLACE, RIGHT TIME','For once the coordinates are perfect. <b>Doctor +5 for the next encounter.</b>')}
   run.mods.excludeKey='surv';run.severePenalty=true;return rareResult('WRONG CENTURY','You spend the encounter trying to get back. <b>Survival contributes nothing next time.</b>')
 }
 if(choice==='spoilers_read')return resolveSpoilers()
}
function resolveSpoilers(){
 let roll=Math.random();
 if(roll<.42){
   let o=currentOpponent();eventState={...eventState,spoilerTarget:o};return spoilerSwapScreen(o)
 }
 if(roll<.57)return rareResult('RED HERRING','The message is accurate, fascinating and completely irrelevant. Nothing changes.');
 if(roll<.72){run.mods.excludeKey=rand(['sci','act','inf','surv']);run.severePenalty=true;return rareResult('RABBIT HOLE',`You obsess over one clue and miss the obvious. <b>${run.mods.excludeKey.toUpperCase()} contributes nothing next encounter.</b>`)}
 if(roll<.86){currentOpponent().form=clamp(currentOpponent().form+3,-5,8);return rareResult('WRONG TIMELINE','The warning was meant for another reality. <b>The next opponent gains +3 Form.</b>')}
 if(roll<.95){run.mods.excludeDoctor=true;run.severePenalty=true;return rareResult('TEMPORAL FEEDBACK','Knowing too much destabilises the Doctor’s part in events. <b>The Doctor is excluded next encounter.</b>')}
 let old=currentOpponent();let rest=run.opponents.slice(run.index+1);if(rest.length){let replacement=rest.shift();run.opponents[run.index]=replacement;run.opponents.splice(run.index+1,0,old)}return rareResult('BUTTERFLY EFFECT','You changed the future by reading it. <b>The next opponent has changed completely.</b>')
}
function spoilerSwapScreen(o){
 let keyScores={[o.k1]:1,[o.k2]:1};
 let candidates=uniqueCharacters(allCharacters().filter(c=>c.type==='Companion'&&!Object.values(team).some(x=>x.name===c.name)))
   .map(c=>({...c,fit:(c[o.k1]||0)+(c[o.k2]||0)})).sort((a,b)=>b.fit-a.fit).slice(0,3);
 app.innerHTML=teamHTML()+`<div class="card event"><div class="small">SPOILERS!</div><h2>${o.name} are next.</h2><div class="story">You have time to prepare. Swap one Companion for a Time Scoop recruit chosen to counter this threat — or keep your team.</div><div class="options">${candidates.map((c,i)=>`<div class="pick companion"><div class="pickTop"><h3>${c.name}</h3><div class="overall">${overall(c)}<small>VALUE</small></div></div><div class="stats">Science ${c.sci} · Action ${c.act} · Influence ${c.inf} · Survival ${c.surv}</div><div class="toolbar"><button onclick="spoilerSwap(${i},'Companion 1')">REPLACE C1</button><button onclick="spoilerSwap(${i},'Companion 2')">REPLACE C2</button></div></div>`).join('')}</div><button class="secondary" style="margin-top:10px" onclick="run.spoilerPrepared=true;showEncounter()">KEEP CURRENT TEAM</button></div>`;
 eventState.candidates=candidates;scrollTop()
}
function spoilerSwap(i,slot){
 let c=eventState.candidates[i];team[slot]={...c};run.spoilerPrepared=true;rareResult('PREPARED',`${c.name} joins the TARDIS team specifically to face ${eventState.spoilerTarget.name}.`)
}

const halfwayEvents=[
{id:'regen',name:'REGENERATION',intro:'The Doctor is changing. There’s no stopping it.'},
{id:'traitor',name:'TRAITOR!',intro:'One of your Team-ups has been working against you.'},
{id:'away',name:'THE ONE THAT GOT AWAY',intro:'Your weakest team member leaves — but the Time Scoop suddenly finds exceptional replacements.'},
{id:'sorry',name:'I’M SORRY. I’M SO SORRY.',intro:'One Companion is lost to the timeline. You need somebody new.'},
{id:'timecrash',name:'TIME CRASH',intro:'Another incarnation of the Doctor has crashed into your timeline.'},
{id:'unit',name:'UNIT REINFORCEMENTS',intro:'UNIT have arrived and they are offering help.'},
{id:'parallel',name:'PARALLEL UNIVERSE',intro:'Somebody is not quite the person you remember.'},
{id:'redecorate',name:'YOU’VE REDECORATED!',intro:'The TARDIS has made room for somebody new.'},
{id:'tardis',name:'THE TARDIS CHOOSES',intro:'The old girl has opinions about your team.'},
{id:'exterminated',name:'EXTERMINATED!',intro:'A blast catches your strongest non-Doctor. You need a replacement immediately.'},
{id:'waited',name:'THE COMPANION WHO WAITED',intro:'One Companion vanishes from the timeline. They may not be gone forever.'}
];
function halfwayEvent(){
 halfwayDone=true;let ev=rand(halfwayEvents);eventState=ev;
 app.innerHTML=teamHTML()+`<div class="card halfway"><div class="small">HALFWAY · 10 / 20</div><h2>${ev.name}</h2><div class="story">${ev.intro}</div><button style="margin-top:14px" onclick="applyHalfway('${ev.id}')">CONTINUE</button></div>`;scrollTop()
}
function replacementCandidates(slot,count=3,elite=false,filterFn=null){
 let chars=uniqueCharacters(allCharacters().filter(c=>role(c,slot)&&!Object.values(team).some(x=>x.name===c.name)&&(!filterFn||filterFn(c))));
 chars=chars.sort((a,b)=>overall(b,slot)-overall(a,slot));
 if(!elite)chars=shuffle(chars);
 return chars.slice(0,count)
}
function chooseReplacement(slot,candidates,title,allowKeep=false,after='showEncounter()'){
 eventState={...eventState,slot,candidates,after};
 app.innerHTML=teamHTML()+`<div class="card halfway"><div class="small">TIME SCOOP</div><h2>${title}</h2><div class="options">${candidates.map((c,i)=>`<div class="pick ${roleClass(c.type)}"><div class="pickTop"><h3>${c.name}</h3><div class="overall">${overall(c,slot)}<small>VALUE</small></div></div><div class="stats">Science ${c.sci} · Action ${c.act} · Influence ${c.inf} · Survival ${c.surv}</div><button onclick="completeReplacement(${i})">RECRUIT</button></div>`).join('')}</div>${allowKeep?`<button class="secondary" style="margin-top:10px" onclick="${after}">KEEP CURRENT TEAM</button>`:''}</div>`;scrollTop()
}
function completeReplacement(i){
 let c=eventState.candidates[i];team[eventState.slot]={...c};let fn=eventState.after||'showEncounter()';eval(fn)
}
function weakestSlot(){return slots.reduce((a,s)=>overall(team[s],s)<overall(team[a],a)?s:a,slots[0])}
function strongestNonDoctor(){let s=slots.slice(1);return s.reduce((a,x)=>overall(team[x],x)>overall(team[a],a)?x:a,s[0])}
function applyHalfway(id){
 if(id==='regen'){let c=replacementCandidates('Doctor',3,false);return chooseReplacement('Doctor',c,'CHOOSE THE NEXT DOCTOR')}
 if(id==='traitor'){let pool=['Team-up 1','Team-up 2'].filter(s=>team[s]);let slot=rand(pool);let old=team[slot].name;delete team[slot];return chooseReplacement(slot,replacementCandidates(slot,3),`${old.toUpperCase()} WAS THE TRAITOR`)}
 if(id==='away'){let slot=weakestSlot();delete team[slot];return chooseReplacement(slot,replacementCandidates(slot,3,true),'THE TIME SCOOP FINDS THE BEST')}
 if(id==='sorry'){let slot=rand(['Companion 1','Companion 2']);delete team[slot];return chooseReplacement(slot,replacementCandidates(slot,3),'FIND A NEW COMPANION')}
 if(id==='timecrash'){return chooseReplacement('Doctor',replacementCandidates('Doctor',3,false),'ANOTHER DOCTOR ARRIVES',true)}
 if(id==='unit'){let slot=rand(['Team-up 1','Team-up 2']);let c=replacementCandidates(slot,3,false,x=>x.tags.includes('UNIT'));return chooseReplacement(slot,c.length?c:replacementCandidates(slot,3),'UNIT OFFERS REINFORCEMENTS',true)}
 if(id==='parallel'){let slot=rand(slots);let old=team[slot];let candidates=uniqueCharacters(allCharacters().filter(c=>role(c,slot)&&c.name!==old.name&&!Object.values(team).some(x=>x.name===c.name))).sort((a,b)=>Math.abs(overall(a,slot)-overall(old,slot))-Math.abs(overall(b,slot)-overall(old,slot))).slice(0,3);team[slot]={...rand(candidates)};return halfwayResult('PARALLEL SELF',`${old.name} has been replaced by ${team[slot].name}.`)}
 if(id==='redecorate'){let candidates=slots.map(slot=>({slot,c:rand(replacementCandidates(slot,5))})).filter(x=>x.c).slice(0,3);eventState={...eventState,swapOptions:candidates};app.innerHTML=teamHTML()+`<div class="card halfway"><div class="small">YOU’VE REDECORATED!</div><h2>Make one change.</h2><div class="options">${candidates.map((x,i)=>`<div class="pick ${roleClass(x.c.type)}"><h3>${x.c.name}</h3><div class="small">Replace ${x.slot}</div><button onclick="redecorateSwap(${i})">SWAP</button></div>`).join('')}</div><button class="secondary" onclick="showEncounter()">KEEP CURRENT TEAM</button></div>`;return}
 if(id==='tardis'){let slot=weakestSlot(),currentScore=overall(team[slot],slot);let candidates=replacementCandidates(slot,8,false).sort((a,b)=>chemFit(b)-chemFit(a));let best=candidates[0];let old=team[slot].name;if(best)team[slot]={...best};return halfwayResult('THE TARDIS HAS DECIDED',`${old} is replaced by ${best?best.name:'nobody'}. The choice is based on team chemistry, not reputation.`)}
 if(id==='exterminated'){let slot=strongestNonDoctor(),old=team[slot].name;delete team[slot];run.severePenalty=true;return chooseReplacement(slot,replacementCandidates(slot,3),`${old.toUpperCase()} IS GONE`)}
 if(id==='waited'){let slot=rand(['Companion 1','Companion 2']),c=team[slot];delete team[slot];run.pendingReturn={slot,char:c,at:run.index+2};return halfwayResult('WAIT FOR ME',`${c.name} is gone. You will face the next two encounters with a four-person team.`)}
}
function chemFit(c){let tags=c.tags||[];return Object.values(team).reduce((n,x)=>n+tags.filter(t=>x.tags.includes(t)).length,0)}
function redecorateSwap(i){let x=eventState.swapOptions[i];team[x.slot]={...x.c};halfwayResult('NEW LOOK TARDIS',`${x.c.name} joins the team.`)}
function halfwayResult(title,text){app.innerHTML=teamHTML()+`<div class="card halfway"><div class="small">HALFWAY EVENT</div><h2>${title}</h2><div class="story">${text}</div><button style="margin-top:14px" onclick="showEncounter()">CONTINUE</button></div>`;scrollTop()}
function restoreWaitingCompanion(){let p=run.pendingReturn;team[p.slot]={...p.char,sci:clamp(p.char.sci+5,0,100),act:clamp(p.char.act+5,0,100),inf:clamp(p.char.inf+5,0,100),surv:clamp(p.char.surv+5,0,100)};run.pendingReturn=null;app.innerHTML=teamHTML()+`<div class="card halfway"><div class="small">THE COMPANION WHO WAITED</div><h2>${p.char.name} is back.</h2><div class="story">Older, tougher and carrying a very long story. <b>+5 to all four stats.</b></div><button style="margin-top:14px" onclick="showEncounter()">CONTINUE</button></div>`;scrollTop()}
function applyWaitingReturnSilently(){let p=run.pendingReturn;if(!p)return;team[p.slot]={...p.char,sci:clamp(p.char.sci+5,0,100),act:clamp(p.char.act+5,0,100),inf:clamp(p.char.inf+5,0,100),surv:clamp(p.char.surv+5,0,100)};run.pendingReturn=null}

function evaluateTeamAwards(){
 let v=Object.values(team),all=t=>v.length===5&&v.every(c=>c.tags.includes(t));
 if(all('Gallifreyan'))unlock('gallifrey');if(all('TARDIS'))unlock('allaboard');if(all('Off Earth'))unlock('offearth');if(all('Daleks'))unlock('daleks');if(all('Davros'))unlock('davros');
 if(v.filter(c=>c.tags.includes('UNIT')).length>=3)unlock('unit');if(v.filter(c=>c.tags.includes('Gallifreyan')).length>=3)unlock('timelords');
 let initials=v.map(c=>c.name.replace(/^(The |First |Second |Third |Fourth |Fifth |Sixth |Seventh |Eighth |War |Ninth |Tenth |Eleventh |Twelfth |Thirteenth |Fourteenth |Fifteenth )/,'')[0]?.toUpperCase());if(initials.length===5&&initials.every(x=>x===initials[0]))unlock('alphabet')
}
function finishRun(){
 evaluateTeamAwards();if(run.wins===20)unlock('perfect');if(run.wins>=15&&rerollsUsed===0)unlock('noRerolls');if(run.wins>=15&&run.severePenalty)unlock('survivor');
 let archive=loadArchive();
 app.innerHTML=teamHTML()+`<div class="card"><div class="small">FINAL RECORD</div><div class="score">${run.wins}-${run.draws}-${run.losses}</div><div class="small">TEAM VALUE ${slots.filter(s=>team[s]).reduce((n,s)=>n+overall(team[s],s),0)}</div></div>
 <div class="card"><div class="small">ENCOUNTER RECORD</div>${run.results.map((x,i)=>`<div class="miniRow"><span>${i+1}. ${x.name}<br><span class="small">Form ${formText(x.form)}</span></span><b class="${x.res==='WIN'?'win':x.res==='LOSS'?'loss':'draw'}">${x.res}</b></div>`).join('')}</div>
 <div class="card"><div class="small">THE BLACK ARCHIVE</div><div class="story">${archive.awards.length} records currently unlocked on this device.</div><button class="secondary" style="margin-top:10px" onclick="showArchive()">OPEN BLACK ARCHIVE</button></div>
 ${run.wins>=15?multiDoctorPrompt():`<div class="card"><button onclick="startGame()">PLAY AGAIN</button><button class="secondary" style="margin-top:8px" onclick="menu()">MENU</button></div>`}`;scrollTop()
}
function multiDoctorPrompt(){return `<div class="card vortex"><div class="small">TIME SCOOP OVERLOAD</div><h2>Another Doctor is breaking through.</h2><p>Fifteen wins has destabilised the timeline. Recruit another incarnation and enter the Bonus Game.</p><button onclick="chooseBonusDoctor()">RECRUIT ANOTHER DOCTOR</button></div>`}
function chooseBonusDoctor(){
 let current=team.Doctor.name;let docs=uniqueCharacters(allCharacters().filter(c=>c.type==='Doctor'&&c.name!==current&&doctorNumbers[c.name]>=settings.minDoc&&doctorNumbers[c.name]<=settings.maxDoc));
 let candidates=shuffle(docs).slice(0,3);eventState={candidates};
 app.innerHTML=teamHTML()+`<div class="card vortex"><div class="small">TIME SCOOP OVERLOAD</div><h2>Choose another Doctor.</h2><div class="options">${candidates.map((c,i)=>`<div class="pick doctor"><div class="pickTop"><h3>${c.name}</h3><div class="overall">${overall(c)}<small>VALUE</small></div></div><button onclick="startBonus(${i})">RECRUIT</button></div>`).join('')}</div></div>`;scrollTop()
}
function startBonus(i){
 let ally=eventState.candidates[i];bonusRun={ally,index:0,wins:0,draws:0,losses:0,results:[],opponents:buildRunOpponents(bonusOpponents)};showBonusEncounter()
}
function bonusMetric(key){
 let base=teamMetric(key,{}),a=key==='Doctor'?doctorPowerFor(bonusRun.ally):(bonusRun.ally[key]||doctorPowerFor(bonusRun.ally));return(base*5+a)/6
}
function doctorPowerFor(d){return d.sci*.3+d.act*.15+d.inf*.25+d.surv*.15+d.pop*.15}
function showBonusEncounter(){
 if(bonusRun.index>=bonusRun.opponents.length){finishBonus();return}
 let o=bonusRun.opponents[bonusRun.index];
 app.innerHTML=teamHTML()+`<div class="card vortex"><div class="small">BONUS GAME · ${bonusRun.index+1} / ${bonusRun.opponents.length}</div><h2>${o.name}</h2><div class="doctorCrew">${team.Doctor.name} + ${bonusRun.ally.name}</div><div class="form">FORM ${formText(o.form)}</div><button style="margin-top:14px" onclick="resolveBonus()">RUN ENCOUNTER</button></div>`;scrollTop()
}
function resolveBonus(){
 let o=bonusRun.opponents[bonusRun.index],p=(bonusMetric(o.k1)+bonusMetric(o.k2))/2+chemistry()+(Math.random()*10-5),r=p-(o.threat+o.form),res=r>3?'WIN':r<-3?'LOSS':'DRAW';
 if(res==='WIN')bonusRun.wins++;else if(res==='DRAW')bonusRun.draws++;else bonusRun.losses++;
 let txt=story(o,res);bonusRun.results.push({...o,res,story:txt});
 app.innerHTML=teamHTML()+`<div class="card vortex"><div class="small">BONUS GAME · ${o.name}</div><div class="resultWord ${res==='WIN'?'win':res==='LOSS'?'loss':'draw'}">${res}</div><div class="story">${txt}</div><button style="margin-top:14px" onclick="bonusRun.index++;showBonusEncounter()">NEXT</button></div>`;scrollTop()
}
function finishBonus(){
 if(bonusRun.wins===bonusRun.opponents.length)unlock('bonus');
 app.innerHTML=teamHTML()+`<div class="card vortex"><div class="small">BONUS GAME COMPLETE</div><h2>${bonusRun.wins}-${bonusRun.draws}-${bonusRun.losses}</h2><div class="doctorCrew">${team.Doctor.name} + ${bonusRun.ally.name}</div></div><div class="card">${bonusRun.results.map((x,i)=>`<div class="miniRow"><span>${i+1}. ${x.name}</span><b class="${x.res==='WIN'?'win':x.res==='LOSS'?'loss':'draw'}">${x.res}</b></div>`).join('')}<button style="margin-top:12px" onclick="startGame()">PLAY AGAIN</button><button class="secondary" style="margin-top:8px" onclick="menu()">MENU</button></div>`;scrollTop()
}

menu();
</script></body></html>
